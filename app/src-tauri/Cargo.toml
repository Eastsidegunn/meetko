# Not a member of the root workspace: `tauri::generate_context!` needs the built frontend
# (`app/dist`) at compile time, which would break a plain `cargo test --workspace` on a fresh
# checkout, and the Tauri tree is large. It depends on meetko-core by path.
[package]
name = "meetko-app"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "meetko_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
meetko-core = { path = "../../crates/meetko-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
hound = "3"
tiny_http = "0.12"
tar = "0.4"
flate2 = "1"
