[package]
name = "meetko-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.60", default-features = false }
rusqlite = { version = "0.41", features = ["bundled", "blob"] }
sha2 = "0.10"
dirs = "6"
toml = "0.9"
hound = "3"
thiserror = "2"
tempfile = "3"
dunce = "1"
base64 = "0.22"
ureq = "3"
tar = "0.4.46"
flate2 = "1.1.10"
unicode-general-category = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
proptest = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
hound = "3"
tiny_http = "0.12.0"
