[package]
name = "meetko-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "meetko"
path = "src/main.rs"

[dependencies]
meetko-core = { path = "../meetko-core" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ctrlc = "3"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
hound = "3"
tiny_http = "0.12.0"
tar = "0.4.46"
flate2 = "1.1.10"
