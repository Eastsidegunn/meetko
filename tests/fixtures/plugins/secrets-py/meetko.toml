# Test fixture: declares network, API keys and settings like an AI plugin, and does one request.
[package]
id = "meetko/secrets-fixture"
version = "0.1.0"
kind = "plugin"
contract = "0.1"
license = "AGPL-3.0-or-later"
description = "test fixture: one chat completions request with the declared key"

[run]
command = ["python3", "-I", "-S", "plugin.py"]
protocol = "stdio-jsonrpc"

[input]
transcript = true
speakers = true
meeting = false
audio = "none"

[output]
display = ["summary_card"]

[permissions]
network = true
secrets = ["ANTHROPIC_API_KEY", "OPENAI_API_KEY"]
settings = ["ANTHROPIC_MODEL", "ANTHROPIC_BASE_URL", "OPENAI_BASE_URL", "OPENAI_MODEL"]
