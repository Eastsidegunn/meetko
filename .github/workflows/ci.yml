name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# a newer push to the same branch or PR cancels the run it supersedes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # the toolchain every job uses; bump deliberately (clippy lints change between releases)
  RUST_TOOLCHAIN: "1.98.1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # host.rs conformance tests skip when plugins/talk-time-rs is not built; here that is a failure
      MEETKO_REQUIRE_PLUGINS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # the root workspace plus the three crates that are excluded from it
          workspaces: |
            . -> target
            plugins/talk-time-rs -> target
            app/src-tauri -> target
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      # The frontend must be built before anything compiles the app crate:
      # tauri::generate_context! reads app/dist at compile time.
      - name: Frontend install
        run: npm ci
        working-directory: app
      - name: Frontend build (tsc + vite)
        run: npm run build
        working-directory: app

      # talk-time-rs is an independent crate; the Python and Rust conformance tests run its binary
      # (target/release/talk-time-rs, talk-time-rs.exe on Windows), so build it before they run
      - name: Build the talk-time-rs plugin
        run: cargo build --release --locked
        working-directory: plugins/talk-time-rs
      - name: Plugin clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: plugins/talk-time-rs

      - name: Python reference tests
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest tests
      - name: Plugin index tests (tomllib needs Python 3.11+)
        run: python -I tools/plugin-index/test_build_index.py

      - name: Rust tests (workspace)
        run: cargo test --workspace --locked
      - name: Clippy (workspace)
        run: cargo clippy --workspace --locked --all-targets -- -D warnings

      # the desktop app is not a workspace member (see Cargo.toml); WebView2 ships on windows-latest
      - name: App crate tests
        run: cargo test --locked
        working-directory: app/src-tauri
      - name: App crate clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: app/src-tauri

      # cargo fmt --check is not run: the code is not formatted with rustfmt yet

  # The sherpa-onnx engine links prebuilt libraries and fetch-libs.sh only knows the macOS ones,
  # so its tests and the Swift capture sidecar tests run on macOS only.
  macos-native:
    name: native (macOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            engines/sherpa-stream -> target
            engines/nemotron-stream -> target
      - name: Fetch the pinned sherpa-onnx libraries
        run: engines/sherpa-stream/fetch-libs.sh
      - name: Engine tests
        run: cargo test --locked
        working-directory: engines/sherpa-stream
      - name: Fetch the pinned NeMo-Speech.cpp libraries
        run: engines/nemotron-stream/fetch-libs.sh
      - name: Nemotron engines tests (stream and diarization; the model-backed tests skip without the models)
        run: cargo test --locked
        working-directory: engines/nemotron-stream
      - name: Nemotron engines clippy
        run: cargo clippy --locked --all-targets -- -D warnings
        working-directory: engines/nemotron-stream
      - name: Swift capture tests
        run: ./run-tests.sh
        working-directory: capture/macos
